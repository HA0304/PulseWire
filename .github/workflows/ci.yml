name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify CLI startup
        run: python -m pulsewire --help
      - name: Verify Streamlit startup
        run: |
          timeout 15s python -m streamlit run dashboard.py --server.headless true --server.port 8501 > /tmp/pulsewire-streamlit.log 2>&1 || test $? -eq 124
          grep -q "You can now view your Streamlit app" /tmp/pulsewire-streamlit.log
